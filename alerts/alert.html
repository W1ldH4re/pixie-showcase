<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Pixie · Алерты</title>
<link rel="stylesheet" href="../assets/pixie.css">
<style>
  /* Прозрачный источник ~1000×700.
     Без параметров — демо по кругу. Один алерт: alert.html?type=sub&name=Lumi&amount=3
     type: follow | sub | donate | raid. Из своего кода: pixieAlert('donate', 'Lumi', '300 ₽') */
  .alert {
    --accent: var(--pink);
    position: absolute; left: 50%; top: 50%; width: 680px;
    transform: translate(-50%, -50%) scale(.4); opacity: 0;
    display: flex; flex-direction: column; align-items: center;
  }
  .alert.show { animation: pop-in .8s cubic-bezier(.2, 1.5, .4, 1) forwards; }
  .alert.hide { animation: pop-out .7s ease-in forwards; }
  .alert .wings { width: 230px; margin-bottom: -44px; position: relative; z-index: 2; }
  .alert.show .wings .wing { animation-duration: .9s; }

  .card { position: relative; width: 100%; --r: 40px; }
  .card .fill { background: linear-gradient(180deg, rgba(52,26,87,.92), rgba(20,10,38,.94)); }
  .card .ring { background: linear-gradient(120deg, var(--accent), var(--lilac), var(--mint), var(--accent)); background-size: 300% 300%; }
  .content { position: relative; padding: 64px 40px 44px; text-align: center; }
  .type { font-size: 26px; border-color: var(--accent); }
  .type .lbl { color: var(--accent); text-transform: uppercase; letter-spacing: .16em; }
  .type [data-icon] { width: 26px; height: 26px; color: var(--accent); }
  .name { font-size: 96px; margin: 10px 0 -.15em; padding-bottom: .15em; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .text { font-size: 32px; font-weight: 800; margin-top: 2px; color: rgba(255,245,251,.85); }
  .text b { color: var(--accent); }

  @keyframes pop-in  { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.4); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes pop-out { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -75%) scale(.85); } }
</style>
</head>
<body>
  <canvas class="sparkles" id="dust" data-density="0.000001"></canvas>

  <div class="alert" id="alert">
    <div class="wings"></div>
    <div class="frame card">
      <div class="fill"></div>
      <div class="ring"></div>
      <span class="corner tl spark"></span><span class="corner tr spark"></span>
      <span class="corner bl spark"></span><span class="corner br spark"></span>
      <div class="content">
        <span class="pill type"><span id="icon" data-icon="heart"></span><span class="lbl" id="label"></span></span>
        <div class="name logo" id="name"></div>
        <div class="text" id="text"></div>
      </div>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../assets/pixie.js"></script>
  <script>
    const TYPES = {
      follow: { label: 'новый фолловер', icon: 'heart', accent: '#ff79c6', text: () => 'добро пожаловать в волшебный лес!' },
      sub:    { label: 'подписка',       icon: 'star',  accent: '#b49bff', text: (a) => a ? `уже <b>${a} мес.</b> волшебства` : 'спасибо за поддержку!' },
      donate: { label: 'донат',          icon: 'gift',  accent: '#ffd98a', text: (a, m) => (a ? `<b>${a}</b>` : 'спасибо!') + (m ? ` · ${m}` : '') },
      raid:   { label: 'рейд',           icon: 'chat',  accent: '#7cf0d4', text: (a) => `${a ? `<b>${a}</b> гостей` : 'гости'} прилетели в лес!` }
    };
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const el = document.getElementById('alert');
    let busy = Promise.resolve();

    function show(type, name, amount, message, hold = 5200) {
      const t = TYPES[type] || TYPES.follow;
      el.style.setProperty('--accent', t.accent);
      const ic = document.getElementById('icon');
      ic.dataset.icon = t.icon; ic.innerHTML = Pixie.icon(t.icon);
      document.getElementById('label').textContent = t.label;
      const nm = document.getElementById('name');
      nm.textContent = name || 'кто-то волшебный';
      // длинные ники уменьшаем, чтобы влезли целиком
      let size = 96; nm.style.fontSize = size + 'px';
      while (nm.scrollWidth > nm.clientWidth && size > 44) nm.style.fontSize = (size -= 4) + 'px';
      document.getElementById('text').innerHTML = t.text(esc(amount), esc(message));
      el.classList.remove('hide'); void el.offsetWidth; el.classList.add('show');
      return new Promise((done) => {
        setTimeout(() => {
          const r = el.getBoundingClientRect();
          const fx = document.getElementById('dust')._fx;
          fx.burst(r.left + r.width / 2, r.top + 40, 90, [t.accent, '#fff5fb', '#ffd98a']);
          fx.burst(r.left + 30, r.top + r.height / 2, 40, [t.accent, '#fff5fb']);
          fx.burst(r.right - 30, r.top + r.height / 2, 40, [t.accent, '#fff5fb']);
        }, 250);
        setTimeout(() => { el.classList.replace('show', 'hide'); setTimeout(done, 800); }, hold);
      });
    }
    // очередь, чтобы алерты не наезжали друг на друга
    window.pixieAlert = (...a) => (busy = busy.then(() => show(...a)));

    // алерт можно вызвать снаружи: iframe.contentWindow.postMessage({ pixieAlert: ['sub', 'Lumi', '3'] }, '*')
    addEventListener('message', (e) => { if (e.data && Array.isArray(e.data.pixieAlert)) pixieAlert(...e.data.pixieAlert); });

    const type = Pixie.param('type');
    if (Pixie.param('manual')) {
      // ?manual=1 — ничего не показываем сами, ждём сообщений
    } else if (type) {
      const once = () => pixieAlert(type, Pixie.param('name'), Pixie.param('amount'), Pixie.param('message'));
      once();
      if (Pixie.param('loop')) setInterval(once, 8000);
    } else {
      const demo = [
        ['follow', 'Moonberry'], ['sub', 'Starlight_Fox', '6'],
        ['donate', 'Lumi', '300 ₽', 'на чай для феи'], ['raid', 'CozyBunny', '42']
      ];
      let i = 0;
      const next = () => pixieAlert(...demo[i++ % demo.length]).then(() => setTimeout(next, 1200));
      setTimeout(next, 600);
    }
  </script>
</body>
</html>
